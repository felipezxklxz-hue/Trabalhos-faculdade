<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONG Solidária - Cadastro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>ONG Solidária</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="cadastro.html">Cadastro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastre-se como Colaborador</h2>
            <p>Preencha os seus dados abaixo para fazer parte da nossa rede de apoio.</p>

            <!-- Formulário interativo com validações nativas do HTML5 -->
            <form action="#" method="POST">
                
                <!-- Grupo 1: Dados Pessoais -->
                <fieldset>
                    <legend>Informações Pessoais</legend>
                    
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite o seu nome completo">

                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>

                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}">

                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </fieldset>

                <!-- Grupo 2: Contato e Endereço -->
                <fieldset>
                    <legend>Contato e Endereço</legend>
                    
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000" pattern="\(\d{2}\)\s\d{5}-\d{4}">

                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required placeholder="00000-000" pattern="\d{5}-\d{3}">

                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required placeholder="Nome da cidade">

                    <label for="estado">Estado (UF):</label>
                    <input type="text" id="estado" name="estado" required placeholder="Ex: SP" maxlength="2">
                </fieldset>

                <!-- Botão de Envio -->
                <button type="submit">Finalizar Cadastro</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Solidária. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
